<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Transcript</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!--
    Single content slot.
    - Default (lower-third / overlay): one paragraph at a time.
      Bible verse completely replaces the subtitle when active.
    - Full transcript mode (?full=true): scrolling history.
  -->
  <div id="slot">

    <!-- Subtitle view -->
    <div id="view-subtitle">
      <p id="current-text"></p>
      <p id="interim-text"></p>
    </div>

    <!-- Bible view — shown instead of subtitle when a reference is active -->
    <div id="view-bible" class="hidden">
      <p id="bible-ref"></p>
      <p id="bible-text"></p>
    </div>

  </div>

  <!-- Full-transcript mode scroll container (activated by ?full=true) -->
  <div id="full-container" class="hidden">
    <div id="transcript"></div>
    <p id="full-interim"></p>
  </div>

  <!-- Subtle connection indicator -->
  <div id="conn-dot" class="disconnected" title="WebSocket status"></div>

  <script src="/static/app.js"></script>
</body>
</html>
